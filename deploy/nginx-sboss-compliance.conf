# Nginx site for the Compliance Platform: serves the built screens and passes /api to the Node server.
# Copy to /etc/nginx/sites-available/sboss-compliance, link it into sites-enabled, then run certbot for HTTPS.
server {
    listen 80;
    server_name sboss-compliance.sboss.net.in;

    root /var/www/sboss-compliance;
    index index.html;

    # Uploads: up to 6 Excel files of 15 MB, or a zip of 100 MB
    client_max_body_size 210m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The Complinity imports can take several minutes
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Built files have a hash in their name, so they can be kept for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other address is a screen of the app
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}