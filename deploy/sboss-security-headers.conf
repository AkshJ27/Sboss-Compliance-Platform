# Security headers for every screen of the Compliance Platform (the API sets its own through helmet).
# Lives at /etc/nginx/snippets/sboss-security-headers.conf and is included in each location that sets its own headers,
# because Nginx drops server-level add_header lines in any location that has add_header of its own.

# Browsers must not guess file types: a file is only ever treated as what the server says it is
add_header X-Content-Type-Options "nosniff" always;

# Always use HTTPS for this site, for one year, so nobody can be pushed onto plain http
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Only this site's own scripts may run. Styles may be inline because Ant Design writes its styles at run time.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# The site may not be shown inside another site's frame (clickjacking)
add_header X-Frame-Options "DENY" always;

# Do not send this site's addresses to other sites, and switch off device features the app never uses
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;